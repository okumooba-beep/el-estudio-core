<!doctype html>
<html lang="es" class="light-boot">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=overlays-content" />
    <meta name="theme-color" content="#120F0C" />
    <meta name="description" content="El Estudio — un lugar personal para pensar. Hoy es el único lugar donde puedes actuar." />
    <!--
      La app se abre como un lugar, no como una página: sin barra de
      navegador, con su propio tono en la barra de estado (el color real
      lo corrige src/lib/light/applyLight.ts antes del primer paint).

      Sprint 031 ("Eliminar movimiento/zoom involuntario"): interactive-
      widget pasa de resizes-content a overlays-content. resizes-content
      encoge el layout viewport real cuando se abre el teclado en pantalla
      — y la habitación (fixed inset-0, background-size:cover, ver
      RoomBackground.tsx/index.html más abajo) recalcula su cover contra
      ese viewport más chico en cada tap sobre cualquier input (captura
      del Umbral, Cuaderno, bloques de Agenda): eso es el "la habitación
      se acerca y hay que echarla hacia atrás" que se sentía al escribir.
      No existe ningún motor de cámara real corriendo hoy (SceneStage/
      useCameraRig nunca se construyeron, ver comentario de
      .room-layer-photo) — este único atributo era la única causa real
      del movimiento. overlays-content deja el teclado flotando encima
      del contenido sin tocar el tamaño del viewport, así que la foto
      fija nunca vuelve a recalcular su escala.
    -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="El Estudio" />
    <title>El Estudio</title>
  </head>
  <body>
    <!--
      La habitación (ver src/components/room/RoomBackground.tsx) ya existe
      acá, en el HTML, antes de que React monte nada: mismas clases
      .room-layer-* que ya pinta el motor de luz, sin script propio. Así
      el espacio ya está iluminado con la hora real (applyLight corre
      antes del primer paint) cuando la información recién empieza a
      montarse dentro de #root — la habitación aparece primero, nunca al
      revés (Sprint "Arrival").

      Sprint 020 (World Visual Foundation): room-layer-photo es la base —
      la foto North Star (public/room/estudio-hero.png) que hasta ahora
      solo existía como asset sin usar. Ventana y lámpara siguen encima,
      ahora como el acento de luz que respira sobre la foto real, no como
      la habitación entera.
    -->
    <div aria-hidden class="pointer-events-none fixed inset-0 -z-10 overflow-hidden">
      <div class="room-layer-photo absolute inset-0"></div>
      <div class="room-layer room-layer-window absolute inset-0"></div>
      <div class="room-layer room-layer-lamp absolute inset-0"></div>
      <div class="room-layer-grain absolute inset-0"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/light-bootstrap.ts"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
